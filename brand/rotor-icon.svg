<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Rotor</title>
  <!-- Icono de app: aro de la caja y rotor de un automático. El símbolo ocupa el 69% del
       lienzo, dentro de la zona segura del 80% de los iconos adaptables de Android. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C98A"/><stop offset="1" stop-color="#B8963E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0D0D0D"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#g)" stroke-width="18"/>
  <path transform="rotate(-35 256 256)" d="M124 256 a132 132 0 0 1 264 0 h-62 a70 70 0 0 0 -140 0 z" fill="url(#g)"/>
  <circle cx="256" cy="256" r="22" fill="url(#g)"/>
  <circle cx="256" cy="256" r="8" fill="#0D0D0D"/>
</svg>
