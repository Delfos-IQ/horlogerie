name: Desplegar Worker

# Despliega worker/ en Cloudflare cuando cambia en main (o a mano desde Actions).
# Requisitos (una sola vez, ver docs/play/README.md → «Despliegue automático del Worker»):
#   - Secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
#   - El id real del namespace KV en worker/wrangler.toml
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar configuración
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if grep -q "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" worker/wrangler.toml; then
            echo "::error::Pon el id real del namespace KV en worker/wrangler.toml antes de desplegar."
            exit 1
          fi

      - name: Desplegar con Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Comprobar /health
        run: |
          sleep 5
          curl -fsS https://horlogerie.pedicode-app.workers.dev/health
