name: Desplegar Worker

# Despliega worker/ en Cloudflare cuando cambia en main (o a mano desde Actions).
# Requisitos (una sola vez, ver docs/play/README.md → «Despliegue automático del Worker»):
#   - Secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
#   - Los id reales del namespace KV y de la base D1 en worker/wrangler.toml
# Mientras falte algo, el workflow termina en verde con un aviso y no despliega.
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar configuración
        id: cfg
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Sin configurar no es un error: se avisa y se termina en verde.
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::Despliegue automático no configurado: falta el secreto CLOUDFLARE_API_TOKEN. Despliega el Worker a mano o sigue docs/play/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -q "REPLACE_WITH_YOUR_KV_NAMESPACE_ID\|REPLACE_WITH_YOUR_D1_DATABASE_ID" worker/wrangler.toml; then
            echo "::notice::Despliegue automático no configurado: faltan los id reales del KV o de la base D1 en worker/wrangler.toml."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Desplegar con Wrangler
        if: steps.cfg.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Comprobar /health
        if: steps.cfg.outputs.ready == 'true'
        run: |
          sleep 5
          curl -fsS https://horlogerie.pedicode-app.workers.dev/health
