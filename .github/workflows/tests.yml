name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Versión coherente en todos los archivos
        run: node tools/bump-version.mjs --check

      - name: Sintaxis y linter (sin avisos; módulos ES con importaciones comprobadas)
        run: npx --yes eslint@8.57.0 js worker tests tools sw.js --max-warnings 0

      - name: Tipos de la capa de datos (JSDoc + tsc)
        run: npx --yes -p typescript@5.6.3 tsc -p jsconfig.json

      - name: CSS sin clases huérfanas
        run: python tools/check-css.py

      - name: Todos los módulos disponibles sin conexión
        run: node tools/check-sw.mjs

      - name: Todos los textos tienen versión en inglés
        run: node tools/check-i18n.mjs

      - name: Web (portada, blog y páginas legales se generan sin errores)
        run: cd web && npm ci && node build.mjs

      - name: Lógica de datos (unitarias)
        run: TZ=Europe/Lisbon node tests/storage.test.mjs

      - name: Instalar Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Lector de fichas (sin IA)
        run: node tests/spec-parser.test.mjs

      - name: Servir la app y el Worker
        run: |
          mkdir -p /tmp/srv && ln -sfn "$PWD" /tmp/srv/horlogerie
          python -m http.server 8080 -d /tmp/srv > /tmp/srv.log 2>&1 &
          node tests/worker-harness.mjs ../worker/index.js 8711 > /tmp/worker.log 2>&1 &
          NO_DB=1 node tests/worker-harness.mjs ../worker/index.js 8712 > /tmp/worker-v1.log 2>&1 &
          sleep 2

      - name: Nube 2.0 cifrada (Worker con D1)
        run: python tests/e2e_cloud2.py 8711

      - name: Sincronización v1 entre dispositivos (Worker sin D1)
        run: python tests/e2e_sync.py 8712 v11

      - name: Registro de uso, recomendación y PDF
        run: python tests/e2e_wear.py

      - name: Rellenar desde un enlace, calendario, ranking y por reloj
        run: python tests/e2e_import_history.py 8711

      - name: Nube, clave corta y vincular dispositivos
        run: python tests/e2e_cloud.py 8712

      - name: Inglés, tema, moneda, bienvenida y ficha por secciones
        run: python tests/e2e_i18n.py

      - name: Avisos en el móvil (service worker real y notificaciones)
        run: python tests/e2e_reminders.py

      - name: Rotor Pro (compra en Play simulada y funciones Pro)
        run: |
          node tests/worker-harness.mjs ../worker/index.js 8713 > /tmp/worker-pro.log 2>&1 &
          sleep 2
          python tests/e2e_pro.py 8713
