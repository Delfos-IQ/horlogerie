name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Versión coherente en todos los archivos
        run: node tools/bump-version.mjs --check

      - name: Sintaxis de JavaScript
        run: for f in js/*.js js/modules/*.js sw.js worker/index.js; do node --check "$f"; done

      - name: Linter (sin avisos)
        run: npx --yes eslint@8.57.0 js worker tests tools --max-warnings 0

      - name: CSS sin clases huérfanas
        run: python tools/check-css.py

      - name: Lógica de datos (unitarias)
        run: TZ=Europe/Lisbon node tests/storage.test.mjs

      - name: Instalar Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Lector de fichas (sin IA)
        run: node tests/spec-parser.test.mjs

      - name: Servir la app y el Worker
        run: |
          mkdir -p /tmp/srv && ln -sfn "$PWD" /tmp/srv/horlogerie
          python -m http.server 8080 -d /tmp/srv > /tmp/srv.log 2>&1 &
          node tests/worker-harness.mjs ../worker/index.js 8711 > /tmp/worker.log 2>&1 &
          sleep 2

      - name: Sincronización entre dispositivos
        run: python tests/e2e_sync.py 8711 v11

      - name: Registro de uso, recomendación y PDF
        run: python tests/e2e_wear.py

      - name: Rellenar desde un enlace, calendario, ranking y por reloj
        run: python tests/e2e_import_history.py 8711

      - name: Nube, clave corta y vincular dispositivos
        run: python tests/e2e_cloud.py 8711
