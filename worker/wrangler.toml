name = "horlogerie"
main = "index.js"
compatibility_date = "2024-09-01"
# Keep the variables set in the dashboard (IMPORT_DAILY_CAP, PLAY_PACKAGE…) when deploying with Wrangler
keep_vars = true

# ══════════════════════════════════════════
# Deploy: cd worker && wrangler deploy
# Worker URL: https://horlogerie.pedicode-app.workers.dev
#
# Optional variable: IMPORT_DAILY_CAP (page reads per day, default 300).
# Secret for Rotor Pro (v15): GOOGLE_SERVICE_ACCOUNT = JSON key of the service account
#   that can read the app's orders in Play Console (docs/play/README.md, step 3 bis).
#   Dashboard → Workers → horlogerie → Settings → Variables → Add → Secret,
#   or: wrangler secret put GOOGLE_SERVICE_ACCOUNT < key.json
#   Optional variable PLAY_PACKAGE (default com.delfosiq.rotor).
#
# D1 database (cloud 2.0, end-to-end encrypted, v14+):
#   Cloudflare dashboard → Storage & Databases → D1 → Create database "rotor"
#   → Workers → horlogerie → Settings → Bindings → D1 database
#   → Variable name: DB  →  Database: rotor
#   Tables are created by the Worker on first use. Without DB the Worker keeps
#   the v1 cloud (plain copy in KV).
#
# KV namespace binding:
#   Cloudflare dashboard → Storage & Databases → Workers KV
#   → Create namespace "HORLOGERIE"
#   → Workers → horlogerie → Settings → Bindings → KV Namespaces
#   → Variable name: HORLOGERIE_KV  →  Namespace: HORLOGERIE
#
# ALLOWED_ORIGINS in index.js:
#   Update ALLOWED_ORIGINS array if you deploy the app to a custom domain.
# ══════════════════════════════════════════

[[kv_namespaces]]
binding = "HORLOGERIE_KV"
id      = "6e26bbdee66c4845be8e9c7a2f865735"

[[d1_databases]]
binding       = "DB"
database_name = "rotor"
database_id   = "c41b2855-b2c1-4804-a703-1405ac8e708e"
